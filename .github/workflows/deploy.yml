name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # update.yml 用 GITHUB_TOKEN 推送，按 GitHub 防递归规则不会触发 push 事件，
  # 因此在其运行结束后通过 workflow_run 链式触发部署（官方推荐的接力方案）
  workflow_run:
    workflows: ['Auto Update Changelog']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# concurrency 故意放在下面 deploy job 级而非 workflow 级：workflow 级会在 run 准入时就把
# update 链式触发的空跑也拉进 'pages' 组，cancel-in-progress 可能先取消正在跑的真实部署、
# 随后 changes 才判定 skip——空跑杀真跑；job 级让空跑根本进不了组。
jobs:
  # workflow_run 对每次 update 运行结束都会触发（含无新提交的空跑），
  # 这里对比 update 运行开始时的提交与 main 当前 tip：相同说明没有新提交，跳过部署
  changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # workflow_run 事件的默认 GITHUB_SHA 是 update 运行前的旧提交，必须显式取 main 最新 tip
          fetch-depth: 1
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "update 运行无新提交，跳过部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency: # 只有真要部署的 run 才进组；空跑已在 needs(changes) 的 skip 处被拦下
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      # 三次尝试里成功的那次才有 page_url，其余为空串，用 || 串起来取到它
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 同上：显式取 main tip，避免部署 update 运行前的旧内容
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # deploy-pages 有已知的瞬时故障：制品刚上传成功，它去查制品却得到 0 个，直接报错
      # （2026-11-23 实发，v2.1.331 因此没能发布，GitHub 的建议是"稍后重跑"）。这里就地重试：
      # 最多 3 次、间隔 30s，全部失败才让 job 失败；某次成功后，其后的尝试全部跳过。
      # 三次仍失败（如 GitHub 故障持续数分钟以上）由 SCF 门禁兜底——它探测到线上没跟上，
      # 会改为直接派发本 workflow，见 scf-trigger/index.py。
      # 每个「等待」与其后的尝试用同一个条件：只要下一次尝试要跑，就先等满间隔
      - id: deploy_1
        continue-on-error: true
        run: echo "DRILL 强制失败 deploy_1"; exit 1
      - if: steps.deploy_1.outcome != 'success'
        run: sleep 30
      - id: deploy_2
        if: steps.deploy_1.outcome != 'success'
        continue-on-error: true
        run: echo "DRILL 强制失败 deploy_2"; exit 1
      - if: steps.deploy_1.outcome != 'success' && steps.deploy_2.outcome != 'success'
        run: sleep 30
      - id: deploy_3
        if: steps.deploy_1.outcome != 'success' && steps.deploy_2.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 部署结果
        if: steps.deploy_1.outcome != 'success' && steps.deploy_2.outcome != 'success' && steps.deploy_3.outcome != 'success'
        run: echo "::error::Pages 部署连续 3 次失败"; exit 1
