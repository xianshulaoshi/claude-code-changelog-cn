name: Auto Update Changelog

# 自动更新：检测 Claude Code 新版本 → 用 GLM（智谱 Anthropic 兼容网关）翻译 → 更新 docs 并推送
# 推送后由 deploy.yml 自动发布到 GitHub Pages。
# 主触发源：腾讯云函数 SCF（香港区 changelog-trigger，每半小时，代码见 scf-trigger/）调 workflow_dispatch。
# 需要在仓库 Settings → Secrets and variables → Actions 配置 Secret：GLM_API_KEY（智谱 API Key）

on:
  # 复查更正（2026-11-24）：schedule 会派发，只是稀疏又不准时——cron 每天要 48 班，实测 4.5 天只跑了
  # 16 班（约 3.6 班/天，相邻两班间隔 4～12 小时，没有一班落在 :13/:43）。2026-11-19 首日的
  # 「一窗未发」是新注册 schedule 的早期延迟，不是「不派发」。主触发源仍是云函数 SCF（每半小时，
  # 见 scf-trigger/），本 cron 只作备份：与 SCF 的 workflow_dispatch 共用 concurrency 组，互不冲突。
  # 复核命令：gh api repos/xianshulaoshi/claude-code-changelog-cn/actions/runs?event=schedule
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pull --rebase 需要历史

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检测新版本
        id: gate
        run: |
          code=0
          node scripts/check-new.mjs || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then echo "::error::版本检测失败（数据源不可达？）"; exit 1; fi

      - name: 翻译并生成页面
        if: steps.gate.outputs.code == '0'
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GLM_API_KEY }}
          CHANGELOG_TRANSLATOR_MODEL: glm-5.3
        run: node cli.mjs --all --quiet

      - name: 同步到 docs
        if: steps.gate.outputs.code == '0'
        run: |
          cp out/index.html docs/index.html
          rm -rf docs/versions
          cp -R out/versions docs/versions

      - name: 提交并推送
        if: steps.gate.outputs.code == '0'
        run: |
          git config user.name "claude-changelog-bot"
          git config user.email "xianshulaoshi@users.noreply.github.com"
          git add docs out/cache.json
          if git diff --cached --quiet; then
            echo "渲染结果无变化，跳过推送"
            exit 0
          fi
          LATEST=$(ls docs/versions | sed 's/\.md$//' | sort -V | tail -1)
          git commit -m "docs: 自动更新至 v${LATEST}（$(date -u '+%Y-%m-%d %H:%M') UTC）"
          git pull --rebase --autostash origin main
          git push origin main
          echo "已推送 v${LATEST}，deploy 工作流将自动发布 Pages"
