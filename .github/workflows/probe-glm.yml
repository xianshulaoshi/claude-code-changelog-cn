name: Probe GLM Reachability

# 一次性探针：验证 GitHub Actions 机房（美国）能否访问智谱 Anthropic 兼容端点。
# 预期返回 400/401 说明可达（服务端正常拒绝了 dummy key）；超时/000/403 说明不可达。
# 结论出来后本文件即可删除。

on: [push]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl 智谱端点（dummy key）
        run: |
          set -x
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
            -X POST https://open.bigmodel.cn/api/anthropic/v1/messages \
            -H 'content-type: application/json' \
            -H 'x-api-key: dummy-probe-key' \
            -H 'anthropic-version: 2023-06-01' \
            -d '{"model":"glm-5.3","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')
          echo "HTTP_CODE=$code"
          cat /tmp/resp.json || true
          echo "---"
          case "$code" in
            400|401) echo "✅ REACHABLE：GitHub Actions 可直连智谱端点，纯 GitHub 方案可行" ;;
            *) echo "❌ NOT REACHABLE（code=$code）：需走腾讯云服务器 cron 方案" ;;
          esac
